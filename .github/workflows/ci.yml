name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to a PR supersedes its running checks; a push to main never
# cancels the one before it, so every main commit gets its `package` run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    timeout-minutes: 20
    strategy:
      # One red leg should not hide the others: while CI is being brought up,
      # a single push has to surface every breakage, not just the first.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # The process guard (crates/job-guard): the Windows job-object backend of
      # the per-run container. container.win.test.ts kills a parent and asserts
      # no survivors, grandchildren included — it needs the real binary.
      - name: Build the process guard (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release -p whiphand-job
      - run: npm ci
      - run: npm run typecheck
      # Includes scripts/invariants.test.mjs — the platform-gate allowlist and the
      # grep-shaped invariant checks — so both legs enforce them.
      - run: npm test

  parity:
    # Real spawns end to end, on both platforms. The Windows leg is what closes
    # the gap this job used to name out loud — "a whole workflow's worth of
    # spawning" — and it is the leg that exercises the job object, the pty
    # command-line string and the prompt path together. It also runs the one
    # cross-OS scenario (parity/golden.test.ts): both legs compare their
    # normalized artifact bundle byte for byte against ONE checked-in golden.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install build tools (node-pty source-build fallback)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential python3
      # parity/store-cross.test.ts runs a Rust run-store process against a TS
      # one (it builds crates/whiphand-core's store_probe example itself).
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the process guard (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release -p whiphand-job
      # The CLI half of every CLI-vs-agent test, and the golden scenario, is
      # the Rust binary (parity/cli-command.ts).
      - name: Build the CLI
        run: cargo build --release -p whiphand-cli
      - run: npm ci
      - run: npm run test:parity

  desktop:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test -w desktop
      - run: npm run build -w desktop

  tauri:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Tauri Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      # tauri_build::build() copies bundle.externalBin and bundle.resources on
      # every cargo invocation, `cargo check` included — and all three are
      # gitignored build outputs that only `npm run package` produces. This job
      # asks whether the Rust crate still compiles; whether a bundle can be
      # assembled is the `package` job below. So drop the bundle inputs rather
      # than fabricate empty ones. TAURI_CONFIG is an RFC 7386 merge patch, so
      # null removes the key.
      - name: The Rust crate still compiles
        env:
          TAURI_CONFIG: '{"bundle":{"externalBin":null,"resources":null}}'
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

  # The root Cargo workspace (crates/*): the process guard now, whiphand-core
  # from Phase 1 of docs/migration.md on. macOS is in the matrix here because
  # the migration holds every Rust phase to all three platforms. The Tauri
  # crate is not a member; the job above checks it.
  rust:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The full `npm run package` pipeline — CLI SEA, agent sidecar, and the
  # Tauri bundle — on push to main only, not on PRs: ~4 minutes per platform
  # is too slow for a PR gate, but discovering a packaging break at release
  # time (release.yml, on a pushed tag) is worse. Same runners release.yml
  # uses, so a break here is a break there.
  package:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install Tauri Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - run: npm run package
