name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to a PR supersedes its running checks; a push to main never
# cancels the one before it, so every main commit gets its `package` run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which of the jobs below a PR needs. Skipped at the job level (not
  # with `on: paths:`) so a skipped job reports as "skipped", which counts as
  # passing for a required check. On push to main the filter steps don't run
  # and every gate falls through to its `push` clause: main runs everything.
  # A PR diff goes through the API, so no checkout is needed.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      node: ${{ steps.node_filter.outputs.node }}
      parity: ${{ steps.area_filter.outputs.parity }}
      desktop: ${{ steps.area_filter.outputs.desktop }}
      tauri: ${{ steps.area_filter.outputs.tauri }}
      rust: ${{ steps.area_filter.outputs.rust }}
    steps:
      # Everything except docs and Markdown. `every` makes the negations
      # subtract from `**`; it applies to the whole step, hence a step of its own.
      - uses: dorny/paths-filter@v4
        id: node_filter
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: 'every'
          filters: |
            node:
              - '**'
              - '!docs/**'
              - '!**/*.md'
      # CI edits and line-ending rules (.gitattributes feeds the Windows
      # goldens) turn every area on.
      - uses: dorny/paths-filter@v4
        id: area_filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            parity:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'parity/**'
              - 'packages/test-support/**'
              - 'examples/**'
              - 'apps/desktop/src/parity/**'
              - 'apps/desktop/src/shared/protocol.gen.ts'
              - 'apps/desktop/src/shared/tool-groups.ts'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - '.github/workflows/**'
              - '.gitattributes'
            desktop:
              - 'apps/desktop/src/**'
              - 'apps/desktop/public/**'
              - 'apps/desktop/*'
              - 'packages/test-support/**'
              - 'parity/fixtures/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'
              - '.gitattributes'
            tauri:
              - 'apps/desktop/src-tauri/**'
              - 'crates/**'
              - '.github/workflows/**'
              - '.gitattributes'
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'examples/**'
              - 'parity/fixtures/**'
              - 'apps/desktop/src/shared/protocol.gen.ts'
              - '.github/workflows/**'
              - '.gitattributes'

  test:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.node == 'true'
    timeout-minutes: 20
    strategy:
      # One red leg should not hide the others: while CI is being brought up,
      # a single push has to surface every breakage, not just the first.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Includes scripts/invariants.test.mjs — the platform-gate allowlist and the
      # grep-shaped invariant checks — so both legs enforce them.
      - run: npm test

  parity:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.parity == 'true'
    # Real spawns end to end, on both platforms, through the Rust CLI and
    # agent. The Windows leg is the one that exercises the job object, the
    # ConPTY command line and the prompt path together. It also runs the one
    # cross-OS scenario (parity/golden.test.ts): both legs compare their
    # normalized artifact bundle byte for byte against ONE checked-in golden.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The CLI half of every CLI-vs-agent test, and the golden scenario, is
      # the Rust binary (parity/cli-command.ts).
      - name: Build the CLI
        run: cargo build --release -p whiphand-cli
      # parity/agent.test.ts plays every agent scenario against this binary
      # and compares it with the transcripts recorded for the platform
      # (parity/fixtures/agent/{posix,win32}).
      - name: Build the agent
        run: cargo build --release -p whiphand-agent
      - run: npm ci
      - run: npm run test:parity
        env:
          PARITY_DUMP: ${{ runner.temp }}/agent-transcripts
      # What the agent answered, to diff against the recorded set — or, for a
      # platform without one yet, to review and commit as its first recording.
      - name: Upload the agent transcripts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: agent-transcripts-${{ runner.os }}
          path: ${{ runner.temp }}/agent-transcripts
          if-no-files-found: ignore

  desktop:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.desktop == 'true'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test -w desktop
      - run: npm run build -w desktop

  tauri:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.tauri == 'true'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Tauri Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      # tauri_build::build() copies bundle.resources on every cargo
      # invocation, `cargo check` included — and the web resource is a
      # gitignored build output that only `npm run package` produces. This job
      # asks whether the Rust crate still compiles; whether a bundle can be
      # assembled is the `package` job below. So drop the bundle input rather
      # than fabricate an empty one. TAURI_CONFIG is an RFC 7386 merge patch,
      # so null removes the key.
      - name: The Rust crate still compiles
        env:
          TAURI_CONFIG: '{"bundle":{"resources":null}}'
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

  # The root Cargo workspace (crates/*): core, protocol, agent, CLI and the
  # process guard. macOS is in the matrix here because the migration holds
  # every Rust phase to all three platforms. The Tauri crate is not a member;
  # the job above checks it.
  rust:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The full `npm run package` pipeline — the CLI and the Tauri bundle — on
  # push to main only, not on PRs: ~4 minutes per platform is too slow for a
  # PR gate, but discovering a packaging break at release time (release.yml,
  # on a pushed tag) is worse. Same runners release.yml uses, so a break here
  # is a break there.
  package:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install Tauri Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - run: npm run package
