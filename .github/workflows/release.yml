name: Release

# Runs when a release is published from the GitHub UI, and uploads the CLI
# binaries, desktop bundles and the updater's latest.json into that release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      # Both legs merge their platform into the same latest.json; one at a time
      # so neither overwrites the other's half.
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-24.04
            cli-name: whiphand-linux-x86_64
          - os: windows-latest
            cli-name: whiphand-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Makes the desktop build spawn the bundled sidecar instead of repo-relative node.
      WHIPHAND_PACKAGE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Catches a release tagged before the version bump was merged.
      - name: The tag matches the version in the code
        shell: bash
        run: node scripts/version.mjs --check "${TAG#v}"

      - name: Install Tauri Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci

      - name: Build the CLI
        run: npm run package:cli
      - name: Upload the CLI binary
        shell: bash
        env:
          CLI_NAME: ${{ matrix.cli-name }}
        run: |
          set -euo pipefail
          src="dist/whiphand"
          [ -f "$src.exe" ] && src="$src.exe"
          cp "$src" "$CLI_NAME"
          gh release upload "$TAG" "$CLI_NAME" --clobber

      - name: Prepare the desktop sidecar
        id: prepare
        shell: bash
        run: node scripts/package/prepare-release.mjs | tee /tmp/prepare.out && grep '^bundles=' /tmp/prepare.out >> "$GITHUB_OUTPUT"

      # createUpdaterArtifacts is set here rather than in tauri.conf.json so
      # local and CI builds don't need the signing key.
      - name: Build, sign and upload the desktop bundle
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ github.event.release.id }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: '--config {"bundle":{"createUpdaterArtifacts":true}} --bundles ${{ steps.prepare.outputs.bundles }}'

  checksums:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Attach SHA256SUMS
        run: |
          gh release download "$TAG" -D assets
          rm -f assets/SHA256SUMS
          (cd assets && sha256sum -- * > ../SHA256SUMS)
          gh release upload "$TAG" SHA256SUMS --clobber
