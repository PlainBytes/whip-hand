[package]
name = "whiphand"
version = "0.2.0"
description = "Whiphand desktop shell"
edition = "2021"

[lib]
# Needed so cdylib and the binary target below can both link against the
# same `run()` entry point (standard Tauri 2 mobile/desktop split).
name = "whiphand_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-fs = { version = "2", features = ["watch"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
