[package]
name = "whiphand-agent"
version = "0.4.0"
edition = "2024"
description = "The desktop's agent: the RPC the webview speaks, served in-process over whiphand-core"
publish = false

[dependencies]
whiphand-core = { path = "../whiphand-core" }
whiphand-protocol = { path = "../whiphand-protocol" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
base64 = "0.22"
getrandom = "0.3"
if-addrs = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tokio-util = "0.7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
portable-pty = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tokio-tungstenite = "0.29"
