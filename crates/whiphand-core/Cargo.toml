[package]
name = "whiphand-core"
version = "0.3.5"
description = "Whiphand's workflow schema, validation, config, workspace lookup and run store"
edition = "2024"
publish = false

[dependencies]
saphyr-parser = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
getrandom = "0.3"
unicode-normalization = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
