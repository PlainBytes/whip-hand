[package]
name = "whiphand-tui"
version = "0.4.0"
edition = "2024"
description = "`whiphand tui`: a terminal front end on an in-process whiphand-agent Host"
publish = false

[dependencies]
# Without remote access: the TUI runs beside the desktop and must not bind
# its port (docs/tui-plan.md, section 8).
whiphand-agent = { path = "../whiphand-agent", default-features = false }
whiphand-core = { path = "../whiphand-core" }
whiphand-protocol = { path = "../whiphand-protocol" }
crossterm = { version = "0.28", features = ["event-stream"] }
futures-util = { version = "0.3", default-features = false }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
] }

[dev-dependencies]
insta = "1"
tempfile = "3"
