name: semantics-names
inputs:
  a-b: { required: true }
  a_b: { required: false }
steps:
  - { id: attachments, kind: command, run: x, output: "../x" }
  - { id: con, kind: command, run: "{{ run.nope }} {{ stage.foo }}", shell: "C:\\Windows\\cmd.exe", inputs: [a-b, a_b, later, stage] }
  - { id: later, kind: command, run: x, output: o.log }
  - id: loop
    kind: loop
    until: inner
    on_exhausted: loop
    steps:
      - { id: inner, kind: loop, until: x, steps: [{ id: x, kind: command, run: x, verdict: true }] }
      - { id: stages, kind: stages, items: "{{ loop.nope }}", steps: [{ id: stage, kind: command, run: x, verdict: true, output: s.log }, { id: gate, kind: manual, title: t, instructions: i, enabled: false }] }
  - { id: m, kind: manual, title: t, instructions: i, capture: note, inputs: [s, m, plan, inner] }
  - { id: r, kind: manual, title: t, instructions: i, capture: review }
  - { id: dup, kind: command, run: x }
  - { id: dup, kind: command, run: y }
  - { id: "x\u2028y", kind: command, run: x, inputs: [ "é-ü", "é_ü", "😀" ] }
  - { id: "é-ü", kind: command, run: x, output: a }
  - { id: "é_ü", kind: command, run: x, output: b }
  - { id: "😀", kind: command, run: x, output: c }
