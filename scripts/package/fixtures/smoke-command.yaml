name: smoke-command
# A real (non-dry) run of one command step: in a packaged Windows build this can
# only succeed if the embedded process guard was extracted and started — a build
# that lost it refuses to run at all — and if a POSIX shell was found. `uname`
# is not a builtin: Git's sh.exe finds it only with its own directory on PATH.
steps:
  - id: check
    kind: command
    run: uname
    output: check.log
